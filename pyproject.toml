[project]
name = "ade-radar"
version = "0.1.0"
description = "Personal ADE 2026 alert agent: Instagram, Gmail and the ADE programme -> WhatsApp"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "playwright>=1.45",
    "beautifulsoup4>=4.12",
    "tzdata>=2024.1",  # zoneinfo data on Windows
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ade-radar = "ade_radar.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
